[package]
name = "api_handler"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = {version = "1.43", features = ["full"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"]}
tokio-retry = "0.3"
pyo3 = { version = "0.20", features = ["extension-module"] }
futures = "0.3"

[lib]
crate-type = ["cdylib"]